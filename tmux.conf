# --- GENERAL SETTINGS ---
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g mouse on
set -s escape-time 0      # Faster key response
set -g base-index 1       # Start window numbering at 1
setw -g pane-base-index 1 # Start pane numbering at 1

# --- PREFIX ---
# Set prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- INTUITIVE BINDINGS ---
# Force unbind first to clear conflicts
unbind v
unbind h
unbind %
unbind '"'
unbind n
unbind p

# Splitting: v for Vertical, h for Horizontal
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Windows: n for New, m for Next, p for Previous
bind n new-window -c "#{pane_current_path}"
bind m next-window
bind p previous-window

# Closing: x for Close (no confirmation)
unbind x
bind x kill-pane

# Reload config easily
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# --- NAVIGATION (Vim-style) ---
# Christoomey/vim-tmux-navigator handles Ctrl+h/j/k/l

# --- NORMAL MODE (Copy Mode) ---
setw -g mode-keys vi
bind Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# --- PLUGINS (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Session Persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum Settings
set -g @continuum-save-interval '5' # Save every 5 minutes
set -g @continuum-restore 'on'      # Auto-restore on tmux start

# Theme
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# Initialize TMUX plugin manager (KEEP THIS AT THE BOTTOM)
run '~/.tmux/plugins/tpm/tpm'
